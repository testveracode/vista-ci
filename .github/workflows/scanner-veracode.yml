name: scanner-veracode

# ─────────────────────────────────────────────────────────────────────────────
# CENTRAL Veracode scanner. Lives ONLY in the central Vista CI repository.
# Target repos need NO workflow files — the Vista App sends a repository_dispatch
# event here with the target repo, commit SHA and Veracode profile.
#
# This workflow authenticates AS THE GITHUB APP (private key stored as a secret
# in this central repo), checks out the target repo, runs Veracode Pipeline
# Scan, then publishes the "Vista Scanner" check and PR comment ON THE TARGET
# repo (cross-repo, using the minted app token).
#
# Required secrets in this central repo:
#   VISTA_APP_ID, VISTA_APP_PRIVATE_KEY   (the GitHub App credentials)
#   VERACODE_API_ID, VERACODE_API_KEY     (Veracode credentials)
# ─────────────────────────────────────────────────────────────────────────────
on:
  repository_dispatch:
    types: [vista-scan]

permissions:
  contents: read

jobs:
  scan:
    name: Veracode Pipeline Scan (central)
    runs-on: ubuntu-latest
    env:
      TARGET_OWNER: ${{ github.event.client_payload.owner }}
      TARGET_REPO: ${{ github.event.client_payload.repo }}
      TARGET_FULL: ${{ github.event.client_payload.full_name }}
      COMMIT_SHA: ${{ github.event.client_payload.commit_sha }}
      PROFILE: ${{ github.event.client_payload.veracode.profile }}
      APP_GUID: ${{ github.event.client_payload.veracode.app_guid }}
      POLICY_NAME: ${{ github.event.client_payload.veracode.policy_name }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      BUSINESS_APP: ${{ github.event.client_payload.business_application }}
    steps:
      - name: Mint App installation token for the target repo
        id: apptoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.VISTA_APP_ID }}
          private-key: ${{ secrets.VISTA_APP_PRIVATE_KEY }}
          owner: ${{ github.event.client_payload.owner }}
          repositories: ${{ github.event.client_payload.repo }}

      - name: Checkout target repo @ commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_FULL }}
          ref: ${{ env.COMMIT_SHA }}
          token: ${{ steps.apptoken.outputs.token }}
          path: target

      # ── Auto-detect the target repo's stack so one central workflow can scan
      #    repositories of any language. Detection drives which toolchain is set
      #    up and how the Veracode-uploadable artifact is produced.
      - name: Detect stack
        id: detect
        working-directory: target
        run: |
          set -euo pipefail
          if   [ -f pom.xml ]; then stack=maven
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then stack=gradle
          elif [ -f package.json ]; then stack=node
          elif ls ./*.sln >/dev/null 2>&1 || ls ./*.csproj >/dev/null 2>&1; then stack=dotnet
          elif [ -f go.mod ]; then stack=go
          elif [ -f requirements.txt ] || [ -f setup.py ] || [ -f pyproject.toml ]; then stack=python
          else stack=source
          fi
          echo "stack=$stack" >> "$GITHUB_OUTPUT"
          echo "Detected stack: $stack"

      - name: Setup JDK
        if: steps.detect.outputs.stack == 'maven' || steps.detect.outputs.stack == 'gradle'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        if: steps.detect.outputs.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup .NET
        if: steps.detect.outputs.stack == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Setup Go
        if: steps.detect.outputs.stack == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build artifact
        id: build
        working-directory: target
        env:
          STACK: ${{ steps.detect.outputs.stack }}
        run: |
          set -euo pipefail
          OUT="${GITHUB_WORKSPACE}/veracode-artifact"
          artifact=""
          case "$STACK" in
            maven)
              mvn -B -ntp clean package -DskipTests
              # Maven output dir is target/ relative to the checkout (cwd).
              f="$(ls -1 target/*.war target/*.jar 2>/dev/null | head -n1 || true)"
              [ -n "$f" ] && artifact="$(pwd)/$f"
              ;;
            gradle)
              chmod +x ./gradlew 2>/dev/null || true
              (./gradlew build -x test || gradle build -x test)
              artifact="$(pwd)/$(ls -1 build/libs/*.war build/libs/*.jar 2>/dev/null | head -n1)"
              ;;
            node)
              npm ci --no-audit --no-fund || npm install --no-audit --no-fund
              if node -e "process.exit(require('./package.json').scripts?.build?0:1)"; then npm run build || true; fi
              zip -q -r "${OUT}.zip" . -x '.git/*'
              artifact="${OUT}.zip"
              ;;
            dotnet)
              dotnet build -c Release
              zip -q -r "${OUT}.zip" . -x '.git/*'
              artifact="${OUT}.zip"
              ;;
            go)
              go build ./... || true
              zip -q -r "${OUT}.zip" . -x '.git/*'
              artifact="${OUT}.zip"
              ;;
            *)
              # python / unknown: Veracode accepts a source archive for many langs.
              zip -q -r "${OUT}.zip" . -x '.git/*'
              artifact="${OUT}.zip"
              ;;
          esac
          if [ -z "${artifact}" ] || [ ! -f "${artifact}" ]; then
            echo "::warning::No compiled artifact found for stack '${STACK}'; falling back to source zip."
            zip -q -r "${OUT}.zip" . -x '.git/*'
            artifact="${OUT}.zip"
          fi
          echo "Artifact: ${artifact} ($(du -h "${artifact}" | cut -f1))"
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Run Veracode Pipeline Scan
        id: scan
        continue-on-error: true
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
          ARTIFACT: ${{ steps.build.outputs.artifact }}
        run: |
          set -euo pipefail
          if [ -z "${PROFILE}" ]; then
            echo "scanner_status=error" >> "$GITHUB_OUTPUT"
            echo "::warning::No Veracode profile in payload; scan skipped."
            exit 0
          fi
          curl -sSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip -o pipeline-scan-LATEST.zip pipeline-scan.jar
          # A custom org policy is not a built-in and must be FETCHED first via
          # --request_policy, which writes "<Policy Name>.json". Then it is
          # applied with --policy_file. If the fetch fails, scan without policy
          # gating rather than erroring the whole scan.
          policy_arg=()
          if [ -n "${POLICY_NAME}" ]; then
            if java -jar pipeline-scan.jar \
                 --veracode_api_id "${VERACODE_API_ID}" \
                 --veracode_api_key "${VERACODE_API_KEY}" \
                 --request_policy "${POLICY_NAME}"; then
              pf="$(ls -1 -- *.json 2>/dev/null | grep -iv '^results.json$' | head -n1 || true)"
              [ -n "${pf}" ] && policy_arg=(--policy_file "${pf}") \
                && echo "Using fetched policy file: ${pf}"
            else
              echo "::warning::Could not fetch policy '${POLICY_NAME}'; scanning without policy gating."
            fi
          fi
          set +e
          java -jar pipeline-scan.jar \
            --veracode_api_id "${VERACODE_API_ID}" \
            --veracode_api_key "${VERACODE_API_KEY}" \
            --file "${ARTIFACT}" \
            --project_name "${PROFILE}" \
            "${policy_arg[@]}" \
            --json_output_file results.json
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "scanner_status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "scanner_status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Vista Scanner check on target repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.apptoken.outputs.token }}
          script: |
            const status = '${{ steps.scan.outputs.scanner_status }}' || 'error';
            const conclusion = status === 'passed' ? 'success'
              : status === 'failed' ? 'failure' : 'neutral';
            await github.rest.checks.create({
              owner: process.env.TARGET_OWNER,
              repo: process.env.TARGET_REPO,
              name: 'Vista Scanner',
              head_sha: process.env.COMMIT_SHA,
              status: 'completed',
              conclusion,
              output: {
                title: `Veracode ${status}`,
                summary: `Veracode Pipeline Scan result: **${status}** (profile: ${process.env.PROFILE}).`,
              },
            });

      - name: Update Vista PR comment on target repo
        if: ${{ env.PR_NUMBER != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.apptoken.outputs.token }}
          script: |
            const marker = '<!-- fortiminds-vista -->';
            const status = '${{ steps.scan.outputs.scanner_status }}' || 'error';
            const icon = status === 'passed' ? '✅' : status === 'failed' ? '❌' : '⚠️';
            const scannerLine = `${icon} **Scanner** — Veracode Pipeline Scan: **${status}**`;
            const owner = process.env.TARGET_OWNER, repo = process.env.TARGET_REPO;
            const pr = Number(process.env.PR_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr, per_page: 100,
            });
            const prior = comments.find(c => c.body && c.body.includes(marker));
            if (prior) {
              const body = prior.body.replace(/(⏳|➖|⛔|✅|❌|⚠️) \*\*Scanner\*\*.*$/s, scannerLine);
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr, body: `${marker}\n${scannerLine}`,
              });
            }
